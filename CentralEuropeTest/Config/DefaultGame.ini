[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=CentralEuropeTest
Description=Central European open world test environment

; Adds Epic's free content packs the first time the editor opens the project (the same mechanism
; the "With Starter Content" option of a new project uses). Starter Content supplies the ground
; textures and wind / bird recordings; the Third Person pack supplies the UE5 Mannequin.
; If a pack does not appear, add it by hand: Content Browser > Add > Add Feature or Content Pack.
[StartupActions]
bAddPacks=True
+InsertPack=(PackSource="StarterContent.upack",PackName="StarterContent")
+InsertPack=(PackSource="TP_ThirdPersonBP.upack",PackName="TP_ThirdPersonBP")
